<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for reusable elements -->
  <defs>
    <!-- Five-petal flower definition -->
    <g id="flower" fill="#C5A880">
      <!-- 5 overlapping circles/petals -->
      <circle cx="0" cy="-12" r="9" />
      <circle cx="11.41" cy="-3.71" r="9" />
      <circle cx="7.05" cy="9.71" r="9" />
      <circle cx="-7.05" cy="9.71" r="9" />
      <circle cx="-11.41" cy="-3.71" r="9" />
      <!-- Center hole showing the dark chocolate background color -->
      <circle cx="0" cy="0" r="4" fill="#5D2E17" />
    </g>
  </defs>

  <!-- Dark Chocolate Brown Background Circle -->
  <circle cx="256" cy="256" r="248" fill="#5D2E17" />

  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#C5A880" stroke-width="5" opacity="0.9" />

  <!-- Inner Gold Border -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#C5A880" stroke-width="2.5" opacity="0.6" />
  
  <!-- Inmost Gold Border -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#C5A880" stroke-width="4.5" opacity="0.8" />

  <!-- Flowers at the Top -->
  <!-- Left Top Flower: translated, rotated, and scaled -->
  <use href="#flower" transform="translate(196, 118) rotate(-20) scale(0.95)" />
  <!-- Center Top Flower: translated and scaled -->
  <use href="#flower" transform="translate(256, 96) scale(1.15)" />
  <!-- Right Top Flower: translated, rotated, and scaled -->
  <use href="#flower" transform="translate(316, 118) rotate(20) scale(0.95)" />

  <!-- Text in the Center -->
  <text x="256" y="255" 
        font-family="Marcellus, 'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="88" 
        font-weight="900" 
        fill="#C5A880" 
        text-anchor="middle" 
        letter-spacing="4">EKTA</text>

  <text x="256" y="320" 
        font-family="Marcellus, 'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="54" 
        font-weight="700" 
        fill="#E2D1B9" 
        text-anchor="middle" 
        letter-spacing="3" 
        opacity="0.95">HOTEL</text>

  <!-- Flower at the Bottom -->
  <use href="#flower" transform="translate(256, 392) scale(0.95)" />
</svg>